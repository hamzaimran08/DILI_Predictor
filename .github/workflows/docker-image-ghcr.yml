name: Build, test and publish Docker image to ghcr.io

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Fixed file timestamps so unchanged layers keep the same digest even without the build cache,
  # which lets registries such as Harbor store them only once across releases
  SOURCE_DATE_EPOCH: 0

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dili_predictor:ci
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check predictions match the reference
        run: >
          docker run --rm -v "$PWD/tests:/home/streamlit/app/tests:ro" --entrypoint python
          dili_predictor:ci tests/smoke_test.py

      - name: Check the app starts
        run: |
          docker run -d --name app -p 8501:8501 dili_predictor:ci
          timeout 60 sh -c 'until curl -sf http://localhost:8501/_stcore/health; do sleep 1; done'
          docker rm -f app

      - name: Fail on fixable HIGH/CRITICAL vulnerabilities
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.59.1
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 dili_predictor:ci

      - name: Log in to the Container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value={{date 'YYYYMMDD-HHmmss' tz='Europe/Stockholm'}}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          cache-from: type=gha
          outputs: type=image,push=true,rewrite-timestamp=true
